services:
  release:
    build:
      context: .
      target: builder
    volumes:
      - ./bin:/out
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /wgetbash /out/wgetbash
        printf "\033[1;32m\n"
        printf "  ╔══════════════════════════════════╗\n"
        printf "  ║        WGETBASH PROD BUILD       ║\n"
        printf "  ║  Built: %-26s║\n" "$(/out/wgetbash --version)"
        printf "  ╚══════════════════════════════════╝\n"
        printf "\033[0m\n"



# docker compose -f prod-compose.yml build --no-cache && docker compose -f prod-compose.yml up